<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Full-screen realistic PDF flipbook">
  <meta name="theme-color" content="#090a0c">
  <title>Lodge Magazine 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="viewer-shell" id="viewerShell">
    <div class="wood" aria-hidden="true"></div>
    <header class="floating-header">
      <div class="title-wrap"><span class="book-icon">▰</span><div><h1 id="publicationTitle">Lodge Magazine 2026</h1><p id="pageStatus">Preparing publication…</p></div></div>
      <div class="header-actions"><button class="round-button" id="openButton" title="Open another PDF">＋</button><button class="round-button" id="shareButton" title="Share">↗</button><button class="round-button" id="fullscreenButton" title="Fullscreen">⛶</button></div>
    </header>
    <section class="book-stage" id="dropZone" aria-label="Publication viewer">
      <button class="page-arrow previous" id="previousPage" aria-label="Previous page">‹</button>
      <div class="book-mount" id="bookMount"></div>
      <button class="page-arrow next" id="nextPage" aria-label="Next page">›</button>
      <section class="welcome" id="welcome" hidden><div class="welcome-mark">◩</div><h2>Open a publication</h2><p>Choose a PDF or drag it onto this screen.</p><button class="primary-button" id="welcomeOpen">Choose PDF</button></section>
      <div class="loading" id="loading"><span class="spinner"></span><div><strong id="loadingText">Opening publication…</strong><small id="loadingProgress">Please wait</small></div></div>
      <div class="drop-message" id="dropMessage">Drop PDF to open</div>
    </section>
    <nav class="control-dock" id="controlDock" aria-label="Flipbook controls">
      <button class="dock-button" id="thumbButton" title="Thumbnails">▦</button><button class="dock-button" id="firstPage" title="First page">⇤</button><button class="dock-button desktop-nav" id="dockPrevious" title="Previous page">←</button>
      <label class="page-counter"><span class="sr-only">Page</span><input id="pageInput" inputmode="numeric" value="1" aria-label="Current page"><span id="pageTotal">/ 1</span></label>
      <button class="dock-button desktop-nav" id="dockNext" title="Next page">→</button><button class="dock-button" id="lastPage" title="Last page">⇥</button><span class="dock-divider"></span><button class="dock-button" id="zoomOut" title="Zoom out">−</button><button class="dock-button" id="zoomIn" title="Zoom in">＋</button><a class="dock-button" id="downloadButton" href="#" download title="Download PDF">⇩</a>
    </nav>
    <aside class="thumb-drawer" id="thumbDrawer" hidden><div class="drawer-head"><strong>Pages</strong><button class="round-button" id="closeThumbs">×</button></div><div class="thumb-grid" id="thumbGrid"></div></aside>
  </main>
  <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
