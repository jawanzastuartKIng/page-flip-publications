<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A responsive PDF flipbook viewer">
  <meta name="theme-color" content="#101010">
  <title>My Publication</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101010'/%3E%3Cpath d='M14 13h26a10 10 0 0 1 10 10v28H24A10 10 0 0 1 14 41V13Z' fill='%2328b6d8'/%3E%3Cpath d='M22 13h18a10 10 0 0 1 10 10v24H24a8 8 0 0 0-8 8V19a6 6 0 0 1 6-6Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◩</span>
        <div>
          <h1 id="publicationTitle">My Publication</h1>
          <p id="pageStatus">Ready to open a PDF</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="openButton" type="button" title="Open PDF" aria-label="Open PDF">＋</button>
        <button class="icon-button" id="shareButton" type="button" title="Share" aria-label="Share">↗</button>
        <button class="icon-button" id="fullscreenButton" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </header>

    <main class="stage" id="dropZone">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-book" aria-hidden="true">
          <div class="welcome-page left"><span>YOUR</span></div>
          <div class="welcome-page right"><span>STORY</span></div>
        </div>
        <h2 id="welcomeTitle">Turn any PDF into a beautiful flipbook</h2>
        <p>Choose a PDF, or drag and drop it anywhere on this page.</p>
        <button class="primary-button" id="welcomeOpen" type="button">Choose PDF</button>
        <small>Your PDF stays in your browser unless you add it to the website.</small>
      </section>

      <section class="viewer" id="viewer" hidden aria-label="Publication viewer">
        <button class="edge-button previous" id="edgePrevious" type="button" aria-label="Previous page">‹</button>
        <div class="book-wrap" id="bookWrap">
          <div class="book" id="book" aria-live="polite">
            <article class="paper page-left" id="leftPaper" hidden><canvas id="leftCanvas"></canvas><span class="page-number" id="leftNumber"></span></article>
            <article class="paper page-right" id="rightPaper"><canvas id="rightCanvas"></canvas><span class="page-number" id="rightNumber"></span></article>
            <div class="turn-sheet" id="turnSheet" hidden><canvas id="turnCanvas"></canvas></div>
          </div>
        </div>
        <button class="edge-button next" id="edgeNext" type="button" aria-label="Next page">›</button>
      </section>

      <div class="drop-message" id="dropMessage">Drop PDF to open</div>
      <div class="loading" id="loading" hidden><span class="spinner"></span><span id="loadingText">Loading publication…</span></div>
    </main>

    <aside class="thumb-panel" id="thumbPanel" hidden aria-label="Page thumbnails">
      <div class="thumb-head"><strong>Pages</strong><button class="icon-button" id="closeThumbs" aria-label="Close thumbnails">×</button></div>
      <div class="thumb-grid" id="thumbGrid"></div>
    </aside>

    <footer class="toolbar" id="toolbar" hidden>
      <div class="tool-group">
        <button class="tool" id="thumbButton" type="button" aria-label="Show thumbnails" title="Thumbnails">▦</button>
        <button class="tool" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <output id="zoomValue" class="zoom-value">100%</output>
        <button class="tool" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">＋</button>
      </div>
      <div class="tool-group navigation">
        <button class="tool" id="firstPage" type="button" aria-label="First page">⇤</button>
        <button class="tool" id="previousPage" type="button" aria-label="Previous page">←</button>
        <label class="page-field"><span class="sr-only">Page</span><input id="pageInput" inputmode="numeric" value="1" aria-label="Current page"><span id="pageTotal">/ 1</span></label>
        <button class="tool" id="nextPage" type="button" aria-label="Next page">→</button>
        <button class="tool" id="lastPage" type="button" aria-label="Last page">⇥</button>
      </div>
      <div class="tool-group">
        <button class="tool" id="printButton" type="button" aria-label="Print" title="Print">▣</button>
        <a class="tool tool-link" id="downloadButton" href="#" download aria-label="Download PDF" title="Download">⇩</a>
      </div>
    </footer>
  </div>
  <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
